<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dialogos HSK1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

  :root{
    --bg:#EEEDE2;
    --surface:#FFFFFF;
    --surface-2:#F7F6EC;
    --text:#20261F;
    --text-muted:#666F62;
    --border:#DBD8C7;
    --accent:#3D6B5C;
    --accent-ink:#F4F6F2;
    --accent-soft:#DEE9E2;
    --highlight:#B5482F;
    --highlight-soft:#F3DAD1;
    --bubble-a:#FFFFFF;
    --bubble-b:#EFF3EA;
    --good:#3D7A44;
    --good-soft:#DCEFDD;
    --bad:#AA3B2F;
    --bad-soft:#F5DCD8;
    --shadow:0 1px 2px rgba(32,38,31,0.06), 0 8px 24px -12px rgba(32,38,31,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121812;
      --surface:#1B231C;
      --surface-2:#202A20;
      --text:#E8E6D8;
      --text-muted:#9AA69A;
      --border:#2C3A2C;
      --accent:#77C2A4;
      --accent-ink:#0F1710;
      --accent-soft:#243B31;
      --highlight:#E2795C;
      --highlight-soft:#3B241C;
      --bubble-a:#1F2A20;
      --bubble-b:#212D24;
      --good:#7FCB86;
      --good-soft:#203327;
      --bad:#E68A7C;
      --bad-soft:#3A2420;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -14px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121812;
    --surface:#1B231C;
    --surface-2:#202A20;
    --text:#E8E6D8;
    --text-muted:#9AA69A;
    --border:#2C3A2C;
    --accent:#77C2A4;
    --accent-ink:#0F1710;
    --accent-soft:#243B31;
    --highlight:#E2795C;
    --highlight-soft:#3B241C;
    --bubble-a:#1F2A20;
    --bubble-b:#212D24;
    --good:#7FCB86;
    --good-soft:#203327;
    --bad:#E68A7C;
    --bad-soft:#3A2420;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -14px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  html,body{ background:var(--bg); }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', 'Segoe UI', sans-serif;
    padding:0 16px;
    padding-block:20px 48px;
    min-height:100vh;
    margin:0;
  }
  .hanzi{ font-family:'Noto Serif SC', 'Songti SC', serif; }
  [hidden]{ display:none !important; }

  .wrap{ max-width:1080px; margin:0 auto; }

  header.top{
    display:flex; flex-wrap:wrap; gap:16px 24px;
    align-items:flex-end; justify-content:space-between;
    padding:4px 4px 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:16px;
  }
  header.top h1{
    margin:0; font-size:1.9rem; line-height:1.15;
    font-weight:700;
  }
  header.top h1 .zh{ font-size:1.5rem; color:var(--accent); margin-right:10px; }
  header.top p.sub{ margin:6px 0 0; color:var(--text-muted); font-size:0.92rem; max-width:46ch; }

  .stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:10px 16px; text-align:center; min-width:100px; box-shadow:var(--shadow);
  }
  .stat .n{ font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  .stat .n.flame{ color:var(--highlight); }
  .stat .l{ font-size:0.72rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:4px; }

  .tabbar{ display:flex; gap:8px; margin:18px 0 20px; }
  .tab{
    border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    font-family:inherit; font-size:0.9rem; font-weight:600; padding:9px 18px; border-radius:10px;
    cursor:pointer;
  }
  .tab.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .tab:hover:not(.active){ border-color:var(--accent); color:var(--text); }

  .layout{ display:grid; grid-template-columns:300px 1fr; gap:24px; align-items:start; }
  @media (max-width:760px){ .layout{ grid-template-columns:1fr; } }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow);
  }

  .filters{ padding:14px 14px 4px; display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);
    font-size:0.78rem; padding:5px 11px; border-radius:999px; cursor:pointer;
    font-family:inherit; transition:background .15s, color .15s, border-color .15s;
  }
  .chip:hover{ border-color:var(--accent); color:var(--text); }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .dlist{ list-style:none; margin:0; padding:8px; max-height:640px; overflow-y:auto; }
  .dlist li{ margin:0; }
  .ditem{
    width:100%; text-align:left; background:none; border:none; border-radius:10px;
    padding:10px 12px; cursor:pointer; display:flex; align-items:center; gap:10px;
    font-family:inherit; color:var(--text);
  }
  .ditem:hover{ background:var(--surface-2); }
  .ditem.active{ background:var(--accent-soft); }
  .ditem .mark{
    flex:none; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:0.7rem;
  }
  .ditem.done .mark{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .ditem .txt{ min-width:0; }
  .ditem .txt .zh{ font-size:1.05rem; display:block; }
  .ditem .txt .pt{ font-size:0.76rem; color:var(--text-muted); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ditem .theme{ margin-left:auto; flex:none; font-size:0.68rem; color:var(--text-muted); border:1px solid var(--border); border-radius:999px; padding:2px 8px; }

  .viewer{ padding:22px 26px 26px; min-height:420px; display:flex; flex-direction:column; }

  .empty{ margin:auto; text-align:center; color:var(--text-muted); max-width:34ch; padding:40px 10px; }
  .empty p{ margin:6px 0 0; font-size:0.92rem; }
  .empty button{ margin-top:16px; }

  .vhead{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .vhead .titles .zh{ font-size:1.5rem; font-weight:600; display:block; }
  .vhead .titles .pt{ color:var(--text-muted); font-size:0.9rem; display:block; margin-top:2px; }
  .vhead .theme-tag{ font-size:0.72rem; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:2px 10px; display:inline-block; margin-top:8px; }

  .btnrow{ display:flex; gap:8px; flex-wrap:wrap; }
  button.ghost{
    background:none; border:1px solid var(--border); color:var(--text);
    padding:8px 14px; border-radius:9px; font-family:inherit; font-size:0.85rem; cursor:pointer;
  }
  button.ghost:hover{ border-color:var(--accent); }
  button.ghost:disabled{ opacity:0.4; cursor:not-allowed; }
  button.solid{
    background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent);
    padding:8px 16px; border-radius:9px; font-family:inherit; font-size:0.85rem; font-weight:600; cursor:pointer;
  }
  button.solid:hover{ filter:brightness(1.06); }
  button.solid.done{ background:var(--surface-2); color:var(--accent); }
  button:focus-visible, .ditem:focus-visible, .chip:focus-visible, .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .lines{ display:flex; flex-direction:column; gap:12px; margin:6px 0 22px; }
  .line{ display:flex; }
  .line.spkB{ justify-content:flex-end; }
  .bubble{
    max-width:min(72ch, 86%); border:1px solid var(--border); border-radius:14px;
    padding:12px 16px; cursor:pointer; background:var(--bubble-a);
  }
  .line.spkB .bubble{ background:var(--bubble-b); }
  .bubble .spk{ font-size:0.68rem; color:var(--text-muted); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:3px; }
  .bubble .zh{ font-size:1.35rem; line-height:1.5; }
  .reveal{
    max-height:0; overflow:hidden; opacity:0; transition:max-height .25s ease, opacity .2s ease, margin .2s ease;
  }
  .bubble.open .reveal{ max-height:120px; opacity:1; margin-top:8px; }
  .reveal .py{ font-style:italic; color:var(--accent); font-size:0.94rem; }
  .reveal .pt{ color:var(--text-muted); font-size:0.88rem; margin-top:2px; }
  @media (prefers-reduced-motion:reduce){ .reveal{ transition:none; } }

  .foot{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; border-top:1px solid var(--border); padding-top:16px; margin-top:auto; }
  .hint{ font-size:0.78rem; color:var(--text-muted); }

  /* Completar frases */
  .clozeWrap{ padding:26px 28px 28px; }
  .clozeTop{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .clozeTop .count{ font-size:0.82rem; color:var(--text-muted); }
  .clozeTop .score{ font-size:0.82rem; color:var(--accent); font-weight:600; }
  .dots{ display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 26px; }
  .dot{
    width:11px; height:11px; border-radius:50%; border:1.5px solid var(--border); background:none;
    padding:0; cursor:pointer;
  }
  .dot.current{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .dot.right{ background:var(--good); border-color:var(--good); }
  .dot.wrong{ background:var(--bad); border-color:var(--bad); }

  .clozeCard{ text-align:center; padding:10px 6px 6px; }
  .clozeSentence{ font-size:1.6rem; line-height:1.7; margin-bottom:10px; }
  .blank{
    display:inline-block; min-width:2.4em; border-bottom:2px dashed var(--accent);
    color:var(--accent); font-weight:600; margin:0 2px;
  }
  .blank.filled{ border-bottom-style:solid; }
  .hintRow{ margin-bottom:26px; }
  .clozePt{ color:var(--text-muted); font-size:0.95rem; margin-top:10px; }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:520px; margin:0 auto; }
  @media (max-width:520px){ .options{ grid-template-columns:1fr; } }
  .opt{
    border:1.5px solid var(--border); background:var(--surface-2); border-radius:12px;
    padding:12px 10px; cursor:pointer; font-family:inherit; text-align:center;
  }
  .opt .zh{ font-size:1.25rem; display:block; }
  .opt .py{ font-size:0.78rem; color:var(--text-muted); font-style:italic; display:block; margin-top:2px; }
  .opt .pt{ font-size:0.76rem; color:var(--text-muted); display:block; }
  .opt:hover:not(:disabled){ border-color:var(--accent); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:var(--good-soft); border-color:var(--good); }
  .opt.wrong{ background:var(--bad-soft); border-color:var(--bad); }

  .clozeReveal{ margin-top:22px; font-size:0.92rem; color:var(--text-muted); min-height:1.4em; }
  .clozeReveal .py{ font-style:italic; color:var(--accent); }
  .clozeReveal .msg{ font-weight:600; }
  .clozeReveal .msg.right{ color:var(--good); }
  .clozeReveal .msg.wrong{ color:var(--bad); }

  .clozeNav{ display:flex; justify-content:center; gap:10px; margin-top:24px; }

  .summaryScore{ font-size:3rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; margin:18px 0 8px; }
  .summaryMsg{ color:var(--text-muted); font-size:1rem; margin-bottom:28px; }
  .summaryActions{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }

  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1><span class="zh hanzi">对话</span>Dialogos HSK1</h1>
      <p class="sub">Pratique leitura e vocabulario com o HSK1 — dialogos so com caracteres e frases para completar.</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="n flame" id="statStreak">0</div><div class="l">dias seguidos</div></div>
      <div class="stat"><div class="n" id="statDone">0/20</div><div class="l">dialogos</div></div>
      <div class="stat"><div class="n" id="statCloze">0/18</div><div class="l">frases</div></div>
    </div>
  </header>

  <div class="tabbar">
    <button class="tab active" id="tabDialogos" type="button">Dialogos</button>
    <button class="tab" id="tabCloze" type="button">Completar frases</button>
  </div>

  <div class="layout" id="viewDialogos">
    <div class="panel">
      <div class="filters" id="filters"></div>
      <ul class="dlist" id="dlist"></ul>
    </div>

    <div class="panel viewer" id="viewer">
      <div class="empty" id="empty">
        <div class="zh hanzi" style="font-size:2rem;">你好</div>
        <p>Escolha um dialogo na lista ao lado para comecar a praticar a leitura.</p>
        <button class="solid" id="startFirst">Comecar pelo primeiro nao praticado</button>
      </div>
    </div>
  </div>

  <div class="panel clozeWrap" id="viewCloze" hidden>
    <div class="clozeTop">
      <span class="count" id="clozeCount">Frase 1 de 18</span>
      <span class="score" id="clozeScore">Acertos: 0/18</span>
    </div>
    <div class="dots" id="clozeDots"></div>
    <div class="clozeCard" id="clozeCard"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var DIALOGUES = [
    {id:"d01", theme:"Saudacoes", zh:"你好", pt:"Ola", lines:[
      {s:"A", zh:"你好!", py:"Nǐ hǎo!", pt:"Ola!"},
      {s:"B", zh:"你好!你是学生吗?", py:"Nǐ hǎo! Nǐ shì xuéshēng ma?", pt:"Ola! Voce e estudante?"},
      {s:"A", zh:"是,我是学生。你呢?", py:"Shì, wǒ shì xuéshēng. Nǐ ne?", pt:"Sim, eu sou estudante. E voce?"},
      {s:"B", zh:"我是老师。", py:"Wǒ shì lǎoshī.", pt:"Eu sou professor(a)."},
      {s:"A", zh:"你叫什么名字?", py:"Nǐ jiào shénme míngzi?", pt:"Qual e o seu nome?"},
      {s:"B", zh:"我叫李明。你呢?", py:"Wǒ jiào Lǐ Míng. Nǐ ne?", pt:"Meu nome e Li Ming. E o seu?"},
      {s:"A", zh:"我叫王芳。", py:"Wǒ jiào Wáng Fāng.", pt:"Meu nome e Wang Fang."},
      {s:"B", zh:"很高兴认识你。", py:"Hěn gāoxìng rènshi nǐ.", pt:"Prazer em te conhecer."},
      {s:"A", zh:"认识你,我很高兴。", py:"Rènshi nǐ, wǒ hěn gāoxìng.", pt:"Conhecer voce, estou feliz."}
    ]},
    {id:"d02", theme:"Familia", zh:"我的家人", pt:"Minha familia", lines:[
      {s:"A", zh:"这是你爸爸吗?", py:"Zhè shì nǐ bàba ma?", pt:"Este e seu pai?"},
      {s:"B", zh:"是,这是我爸爸,那是我妈妈。", py:"Shì, zhè shì wǒ bàba, nà shì wǒ māma.", pt:"Sim, este e meu pai, aquela e minha mae."},
      {s:"A", zh:"你有儿子吗?", py:"Nǐ yǒu érzi ma?", pt:"Voce tem filho?"},
      {s:"B", zh:"没有,我有一个女儿。", py:"Méiyǒu, wǒ yǒu yí ge nǚér.", pt:"Nao, eu tenho uma filha."},
      {s:"A", zh:"她几岁?", py:"Tā jǐ suì?", pt:"Quantos anos ela tem?"},
      {s:"B", zh:"她五岁。", py:"Tā wǔ suì.", pt:"Ela tem cinco anos."},
      {s:"A", zh:"你女儿漂亮。", py:"Nǐ nǚér piàoliang.", pt:"Sua filha e bonita."},
      {s:"B", zh:"谢谢。", py:"Xièxie.", pt:"Obrigado(a)."}
    ]},
    {id:"d03", theme:"Horario", zh:"几点了", pt:"Que horas sao", lines:[
      {s:"A", zh:"现在几点?", py:"Xiànzài jǐ diǎn?", pt:"Que horas sao agora?"},
      {s:"B", zh:"现在八点。", py:"Xiànzài bā diǎn.", pt:"Agora sao oito horas."},
      {s:"A", zh:"你几点去学校?", py:"Nǐ jǐ diǎn qù xuéxiào?", pt:"A que horas voce vai a escola?"},
      {s:"B", zh:"我九点去学校。", py:"Wǒ jiǔ diǎn qù xuéxiào.", pt:"Eu vou a escola as nove."},
      {s:"A", zh:"你几点回家?", py:"Nǐ jǐ diǎn huí jiā?", pt:"A que horas voce volta para casa?"},
      {s:"B", zh:"我下午五点回家。", py:"Wǒ xiàwǔ wǔ diǎn huí jiā.", pt:"Eu volto para casa as cinco da tarde."}
    ]},
    {id:"d04", theme:"Calendario", zh:"今天星期几", pt:"Que dia e hoje", lines:[
      {s:"A", zh:"今天几月几号?", py:"Jīntiān jǐ yuè jǐ hào?", pt:"Que dia e mes e hoje?"},
      {s:"B", zh:"今天九月十号。", py:"Jīntiān jiǔ yuè shí hào.", pt:"Hoje e dia dez de setembro."},
      {s:"A", zh:"今天星期几?", py:"Jīntiān xīngqī jǐ?", pt:"Que dia da semana e hoje?"},
      {s:"B", zh:"今天星期五。", py:"Jīntiān xīngqīwǔ.", pt:"Hoje e sexta-feira."},
      {s:"A", zh:"明天呢?", py:"Míngtiān ne?", pt:"E amanha?"},
      {s:"B", zh:"明天星期六。", py:"Míngtiān xīngqīliù.", pt:"Amanha e sabado."}
    ]},
    {id:"d05", theme:"Clima", zh:"天气怎么样", pt:"Como esta o tempo", lines:[
      {s:"A", zh:"今天天气怎么样?", py:"Jīntiān tiānqì zěnmeyàng?", pt:"Como esta o tempo hoje?"},
      {s:"B", zh:"今天很冷。", py:"Jīntiān hěn lěng.", pt:"Hoje esta muito frio."},
      {s:"A", zh:"明天呢?", py:"Míngtiān ne?", pt:"E amanha?"},
      {s:"B", zh:"明天很热,不下雨。", py:"Míngtiān hěn rè, bú xiàyǔ.", pt:"Amanha vai estar muito quente, sem chuva."},
      {s:"A", zh:"太好了!", py:"Tài hǎo le!", pt:"Otimo!"}
    ]},
    {id:"d06", theme:"Animais", zh:"我家的狗", pt:"O cachorro da minha casa", lines:[
      {s:"A", zh:"你家有猫吗?", py:"Nǐ jiā yǒu māo ma?", pt:"Tem gato na sua casa?"},
      {s:"B", zh:"没有,我家有狗。", py:"Méiyǒu, wǒ jiā yǒu gǒu.", pt:"Nao, na minha casa tem cachorro."},
      {s:"A", zh:"狗叫什么名字?", py:"Gǒu jiào shénme míngzi?", pt:"Qual e o nome do cachorro?"},
      {s:"B", zh:"狗叫小白。", py:"Gǒu jiào Xiǎobái.", pt:"O cachorro se chama Xiaobai."},
      {s:"A", zh:"小白很漂亮。", py:"Xiǎobái hěn piàoliang.", pt:"Xiaobai e muito bonito."},
      {s:"B", zh:"谢谢!", py:"Xièxie!", pt:"Obrigado!"}
    ]},
    {id:"d07", theme:"Compras", zh:"买苹果", pt:"Comprando macas", lines:[
      {s:"A", zh:"你想买什么?", py:"Nǐ xiǎng mǎi shénme?", pt:"O que voce quer comprar?"},
      {s:"B", zh:"我想买苹果。", py:"Wǒ xiǎng mǎi píngguǒ.", pt:"Eu quero comprar maca."},
      {s:"A", zh:"苹果多少钱?", py:"Píngguǒ duōshǎo qián?", pt:"Quanto custa a maca?"},
      {s:"B", zh:"五块钱。", py:"Wǔ kuài qián.", pt:"Cinco yuans."},
      {s:"A", zh:"我买五个苹果。", py:"Wǒ mǎi wǔ ge píngguǒ.", pt:"Vou comprar cinco macas."},
      {s:"B", zh:"好,谢谢。", py:"Hǎo, xièxie.", pt:"Certo, obrigado."}
    ]},
    {id:"d08", theme:"Objetos", zh:"这是什么", pt:"O que e isso", lines:[
      {s:"A", zh:"这是什么?", py:"Zhè shì shénme?", pt:"O que e isso?"},
      {s:"B", zh:"这是茶。", py:"Zhè shì chá.", pt:"Isso e cha."},
      {s:"A", zh:"那是什么?", py:"Nà shì shénme?", pt:"O que e aquilo?"},
      {s:"B", zh:"那是杯子。", py:"Nà shì bēizi.", pt:"Aquilo e um copo."},

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var data = JSON.parse(raw);
        state.completedIds = Array.isArray(data.completedIds) ? data.completedIds : [];
        state.history = (data.history && typeof data.history === "object") ? data.history : {};
        state.clozeCorrectIds = Array.isArray(data.clozeCorrectIds) ? data.clozeCorrectIds : [];
      }
    }catch(e){ /* localStorage indisponivel: segue so em memoria */ }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ /* best effort */ }
  }

  function todayLocal(){
    var d = new Date();
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }

  function computeStreak(history){
    var dates = Object.keys(history).filter(function(k){ return history[k]; });
    if(dates.length===0) return 0;
    var set = {}; dates.forEach(function(k){ set[k]=true; });
    var d = new Date();
    var todayStr = todayLocal();
    if(!set[todayStr]){
      d.setDate(d.getDate()-1);
    }
    var streak = 0;
    while(true){
      var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
      var key = y+"-"+m+"-"+day;
      if(set[key]){ streak++; d.setDate(d.getDate()-1); } else { break; }
    }
    return streak;
  }

  function markStudiedToday(){
    state.history[todayLocal()] = true;
  }

  /* ---------- Tabs ---------- */
  function switchTab(tab){
    var d = document.getElementById("viewDialogos");
    var c = document.getElementById("viewCloze");
    document.getElementById("tabDialogos").classList.toggle("active", tab==="dialogos");
    document.getElementById("tabCloze").classList.toggle("active", tab==="cloze");
    d.hidden = tab!=="dialogos";
    c.hidden = tab!=="cloze";
    if(tab==="cloze"){ renderCloze(); }
  }
  document.getElementById("tabDialogos").addEventListener("click", function(){ switchTab("dialogos"); });
  document.getElementById("tabCloze").addEventListener("click", function(){ switchTab("cloze"); });

  /* ---------- Dialogos ---------- */
  function renderFilters(){
    var el = document.getElementById("filters");
    el.innerHTML = "";
    var all = ["Todos"].concat(THEMES);
    all.forEach(function(t){
      var b = document.createElement("button");
      b.className = "chip" + (t===activeFilter ? " active" : "");
      b.type = "button";
      b.textContent = t;
      b.addEventListener("click", function(){ activeFilter = t; renderList(); });
      el.appendChild(b);
    });
  }

  function renderStats(){
    document.getElementById("statStreak").textContent = String(computeStreak(state.history));
    document.getElementById("statDone").textContent = state.completedIds.length + "/" + TOTAL;
    document.getElementById("statCloze").textContent = state.clozeCorrectIds.length + "/" + CTOTAL;
  }

  function renderList(){
    renderFilters();
    var ul = document.getElementById("dlist");
    ul.innerHTML = "";
    var items = DIALOGUES.filter(function(d){ return activeFilter==="Todos" || d.theme===activeFilter; });
    items.forEach(function(d){
      var li = document.createElement("li");
      var done = state.completedIds.indexOf(d.id) !== -1;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ditem" + (done ? " done":"") + (d.id===currentId ? " active":"");
      btn.innerHTML =
        '<span class="mark">' + (done ? "&#10003;" : "") + '</span>' +
        '<span class="txt"><span class="zh hanzi">' + d.zh + '</span><span class="pt">' + d.pt + '</span></span>' +
        '<span class="theme">' + d.theme + '</span>';
      btn.addEventListener("click", function(){ openDialogue(d.id); });
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

    currentId = id;

    var head = document.createElement("div");
    head.className = "vhead";
    var done = state.completedIds.indexOf(d.id) !== -1;
    head.innerHTML =
      '<div class="titles">' +
        '<span class="zh hanzi">' + d.zh + '</span>' +
        '<span class="pt">' + d.pt + '</span>' +
        '<span class="theme-tag">' + d.theme + '</span>' +
      '</div>' +
      '<div class="btnrow">' +
        '<button class="ghost" id="toggleAll" type="button">Mostrar tudo</button>' +
      '</div>';
    v.appendChild(head);

    var lines = document.createElement("div");
    lines.className = "lines";
    d.lines.forEach(function(ln){
      var row = document.createElement("div");
      row.className = "line spk" + ln.s;
      var b = document.createElement("div");
      b.className = "bubble";
      b.tabIndex = 0;
      b.setAttribute("role","button");
      b.innerHTML =
        '<div class="spk">Falante ' + ln.s + '</div>' +
        '<div class="zh hanzi">' + ln.zh + '</div>' +
        '<div class="reveal"><div class="py">' + ln.py + '</div><div class="pt">' + ln.pt + '</div></div>';
      function toggle(){ b.classList.toggle("open"); }
      b.addEventListener("click", toggle);
      b.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); }});
      row.appendChild(b);
      lines.appendChild(row);
    });
    v.appendChild(lines);

    var foot = document.createElement("div");
    foot.className = "foot";
    foot.innerHTML =
      '<span class="hint">Toque em cada fala para revelar o pinyin e a traducao.</span>' +
      '<button class="solid' + (done?" done":"") + '" id="markDone" type="button">' +
        (done ? "Praticado hoje &#10003;" : "Marcar como praticado") +
      '</button>';
    v.appendChild(foot);

    document.getElementById("toggleAll").addEventListener("click", function(){
      var bubbles = lines.querySelectorAll(".bubble");
      var anyClosed = Array.prototype.some.call(bubbles, function(bb){ return !bb.classList.contains("open"); });
      bubbles.forEach(function(bb){ bb.classList.toggle("open", anyClosed); });
      this.textContent = anyClosed ? "Esconder tudo" : "Mostrar tudo";
    });

    document.getElementById("markDone").addEventListener("click", function(){
      togglePracticed(d.id);
    });

    renderList();
  }

  function togglePracticed(id){
    var i = state.completedIds.indexOf(id);
    if(i===-1){
      state.completedIds.push(id);
    } else {
      state.completedIds.splice(i,1);
    }
    markStudiedToday();
    saveState();
    renderStats();
    if(currentId===id) openDialogue(id);
    else renderList();
  }

  document.getElementById("startFirst").addEventListener("click", function(){
    var next = DIALOGUES.find(function(d){ return state.completedIds.indexOf(d.id)===-1; }) || DIALOGUES[0];
    switchTab("dialogos");
    openDialogue(next.id);
  });

  /* ---------- Completar frases (cloze) ---------- */
  function renderClozeDots(){
    var wrap = document.getElementById("clozeDots");
    wrap.innerHTML = "";
    if(clozeView === "summary") return;
    clozeOrder.forEach(function(id, i){
      var ex = clozeById(id);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "dot";
      if(i===clozeIndex) b.classList.add("current");
      var st = clozeAnswered[ex.id] || null;
      if(st) b.classList.add(st);
      b.title = "Frase " + (i+1);
      b.addEventListener("click", function(){ clozeIndex = i; clozeView = "exercise"; renderCloze(); });
      wrap.appendChild(b);
    });
  }

  function renderClozeSummary(){
    document.getElementById("clozeCount").textContent = "Resultado final";
    document.getElementById("clozeScore").textContent = "Acertos: " + state.clozeCorrectIds.length + "/" + CTOTAL;
    renderClozeDots();

    var n = state.clozeCorrectIds.length;
    var pct = n / CTOTAL;
    var msg;
    if(pct === 1) msg = "Perfeito! Voce acertou todas as frases.";
    else if(pct >= 0.7) msg = "Muito bem! Voce ja domina boa parte do vocabulario.";
    else if(pct >= 0.4) msg = "Bom progresso — vale a pena revisar algumas palavras.";
    else msg = "Vale a pena repetir essas frases para fixar o vocabulario.";

    var card = document.getElementById("clozeCard");
    card.innerHTML = "";

    var score = document.createElement("div");
    score.className = "summaryScore";
    score.textContent = n + "/" + CTOTAL;
    card.appendChild(score);

    var m = document.createElement("div");
    m.className = "summaryMsg";
    m.textContent = msg;
    card.appendChild(m);

    var actions = document.createElement("div");
    actions.className = "summaryActions";
    var review = document.createElement("button");
    review.className = "ghost"; review.type = "button"; review.textContent = "Revisar respostas";
    review.addEventListener("click", function(){ clozeView = "exercise"; clozeIndex = 0; renderCloze(); });
    var restart = document.createElement("button");
    restart.className = "solid"; restart.type = "button"; restart.textContent = "Reiniciar com novas opcoes";
    restart.addEventListener("click", restartCloze);
    actions.appendChild(review); actions.appendChild(restart);
    card.appendChild(actions);
  }

  function restartCloze(){
    clozeOrder = shuffle(CLOZE.map(function(e){ return e.id; }));
    clozeOptionOrder = {};
    clozeAnswered = {};
    clozeHintOpen = {};
    clozeIndex = 0;
    clozeView = "exercise";
    state.clozeCorrectIds = [];
    markStudiedToday();
    saveState();
    renderStats();
    renderCloze();
  }

  function renderCloze(){
    if(clozeView === "summary"){ renderClozeSummary(); return; }
    var ex = clozeById(clozeOrder[clozeIndex]);
    document.getElementById("clozeCount").textContent = "Frase " + (clozeIndex+1) + " de " + CTOTAL;
    document.getElementById("clozeScore").textContent = "Acertos: " + state.clozeCorrectIds.length + "/" + CTOTAL;
    renderClozeDots();

    if(!clozeOptionOrder[ex.id]){
      clozeOptionOrder[ex.id] = shuffle(ex.opts.concat([ex.correct]));
    }
    var options = clozeOptionOrder[ex.id];
    var answeredState = clozeAnswered[ex.id] || null;

    var card = document.getElementById("clozeCard");
    card.innerHTML = "";

    var sent = document.createElement("div");
    sent.className = "clozeSentence hanzi";
    var blankTxt = answeredState ? ex.correct.zh : "    ";
    sent.innerHTML = ex.before + '<span class="blank' + (answeredState?" filled":"") + '">' + blankTxt + '</span>' + ex.after;
    card.appendChild(sent);

    var hintOpen = !!clozeHintOpen[ex.id];
    var hintRow = document.createElement("div");
    hintRow.className = "hintRow";
    var hintBtn = document.createElement("button");
    hintBtn.type = "button";
    hintBtn.className = "ghost";
    hintBtn.textContent = hintOpen ? "Esconder traducao" : "Ver traducao";
    hintBtn.addEventListener("click", function(){
      clozeHintOpen[ex.id] = !clozeHintOpen[ex.id];
      renderCloze();
    });
    hintRow.appendChild(hintBtn);
    if(hintOpen){
      var pt = document.createElement("div");
      pt.className = "clozePt";
      pt.textContent = ex.pt;
      hintRow.appendChild(pt);
    }
    card.appendChild(hintRow);

    var opts = document.createElement("div");
    opts.className = "options";
    options.forEach(function(o){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.innerHTML = '<span class="zh hanzi">'+o.zh+'</span><span class="py">'+o.py+'</span><span class="pt">'+o.pt+'</span>';
      if(answeredState){
        b.disabled = true;
        if(o.zh===ex.correct.zh) b.classList.add("correct");
        else if(clozeAnswered.lastPicked === o.zh && answeredState==="wrong") b.classList.add("wrong");
      }
      b.addEventListener("click", function(){ answerCloze(ex, o); });
      opts.appendChild(b);
    });
    card.appendChild(opts);

    var reveal = document.createElement("div");
    reveal.className = "clozeReveal";
    if(answeredState){
      var msg = answeredState==="right" ? "Certo!" : "Quase — a resposta certa e " + ex.correct.zh + ".";
      reveal.innerHTML = '<span class="msg ' + answeredState + '">' + msg + '</span><br><span class="py">' + ex.full + '</span>';
    }
    card.appendChild(reveal);

    var nav = document.createElement("div");
    nav.className = "clozeNav";
    var prev = document.createElement("button");
    prev.className = "ghost"; prev.type = "button"; prev.textContent = "Anterior";
    prev.disabled = clozeIndex===0;
    prev.addEventListener("click", function(){ if(clozeIndex>0){ clozeIndex--; renderCloze(); } });
    var isLast = clozeIndex === CTOTAL-1;
    var next = document.createElement("button");
    next.className = "solid"; next.type = "button";
    next.textContent = isLast ? "Ver pontuacao final" : "Proxima";
    next.disabled = !answeredState;
    next.addEventListener("click", function(){
      if(isLast){ clozeView = "summary"; renderCloze(); }
      else if(clozeIndex < CTOTAL-1){ clozeIndex++; renderCloze(); }
    });
    nav.appendChild(prev); nav.appendChild(next);
    card.appendChild(nav);
  }

  function answerCloze(ex, picked){
    if(clozeAnswered[ex.id]) return;
    var isRight = picked.zh === ex.correct.zh;
    clozeAnswered[ex.id] = isRight ? "right" : "wrong";
    clozeAnswered.lastPicked = picked.zh;
    if(isRight && state.clozeCorrectIds.indexOf(ex.id)===-1){
      state.clozeCorrectIds.push(ex.id);
    }
    markStudiedToday();
    saveState();
    renderStats();
    renderCloze();
  }

  /* ---------- Boot ---------- */
  loadState();
  renderStats();
  renderList();
})();
</script>
</body>
</html>
